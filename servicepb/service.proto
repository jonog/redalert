syntax = "proto3";

package servicepb;

service RedalertService {

  // CheckList lists all the checks in configuration
  rpc CheckList(CheckListRequest) returns (CheckListResponse) {}

  // CheckEnable enables a check
  rpc CheckEnable(CheckEnableRequest) returns (CheckEnableResponse) {}

  // CheckDisable disables a check
  rpc CheckDisable(CheckDisableRequest) returns (CheckDisableResponse) {}

  rpc CheckAdd(CheckAddRequest) returns (CheckAddResponse) {}

  // EventList lists retained events for a check.
  rpc EventList(EventListRequest) returns (EventListResponse) {}

}

message CheckAddRequest { string destination = 1; string json = 2; }
message CheckAddResponse { repeated string ids = 1; }

message CheckListRequest {}

message CheckListResponse {
  repeated Check members = 1;
}

message CheckEnableRequest {
  string ID = 1;
}

message CheckEnableResponse {}

message CheckDisableRequest {
  string ID = 1;
}

message CheckDisableResponse {}

message EventListRequest { string ID = 1; }
message EventListResponse { repeated Event events = 1; }
message Event {
  string time = 1;
  map<string, string> tags = 2;
  repeated string messages = 3;
  repeated Metric metrics = 4;
  map<string, string> metadata = 5;
}
message Metric { string name = 1; double value = 2; bool present = 3; }

message Check {
  string ID = 1;
  string name = 2;
  string type = 3;

  enum Status {
    DISABLED = 0;
    UNKNOWN = 1;
    FAILING = 2;
    SUCCESSFUL = 3;
  }
  Status status = 4;

  bool enabled = 5;
}
