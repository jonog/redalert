version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.27.1
    environment:
      DOCKER_API_VERSION: "1.24"
    steps:
      - checkout
      - run: go mod download
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go build ./...
      - run: make build VERSION=ci COMMIT=ci
      - run: test "$(./redalert version)" = "Redalert vci sha: ci"
      - run: python3 scripts/smoke.py ./redalert

workflows:
  build:
    jobs:
      - build
